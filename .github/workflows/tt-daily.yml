name: Table tennis daily feed
on:
  schedule:
    - cron: '17 10 * * *'   # once a day, about 5:17 AM Eastern (6:17 during daylight time)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tt-daily
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build tt_dash.json
        run: python tt/tt_engine.py
      - name: Publish
        run: |
          git config user.name "tt-engine"
          git config user.email "actions@users.noreply.github.com"
          git add tt_dash.json tt/players.json
          git commit -m "table tennis feed $(date -u +%Y-%m-%d)" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
