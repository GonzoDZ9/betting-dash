name: TT probe
on:
  push:
    paths:
      - 'tt/probe.py'
      - '.github/workflows/tt-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run probe
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: python tt/probe.py
      - name: Commit result
        run: |
          git config user.name "tt-engine"
          git config user.email "actions@users.noreply.github.com"
          git add tt/probe.json
          git commit -m "TT probe result" || exit 0
          git pull --rebase
          git push
